name: Bump deploy tag
description: Update a GitOps image tag, commit, and push with rebase-retry. Runs in the caller's checkout with the caller's credentials (the deploy commit stays caller-side).
inputs:
  app-name:
    description: Application name (used in the commit message).
    required: true
  image-base:
    description: "Image repo without tag, e.g. ghcr.io/manyfold-dk/<tenant>/app."
    required: true
  tag:
    description: New image tag to set.
    required: true
  digest:
    description: "Optional image digest (sha256:<hex>) written after the tag, as <tag>@<digest>. Needs manifest, not manifest-dir."
    required: false
    default: ""
  manifest:
    description: "Single Deployment manifest with an inline image: line (mutually exclusive with manifest-dir)."
    required: false
    default: ""
  manifest-dir:
    description: Directory of deployment/kustomization manifests carrying the image (mutually exclusive with manifest).
    required: false
    default: ""
  branch:
    description: Branch to push the deploy commit to.
    required: false
    default: main
  git-user-name:
    description: "Name on the deploy commit, e.g. a GitHub App's '<slug>[bot]' when the push uses its token. Empty keeps the CI identity."
    required: false
    default: ""
  git-user-email:
    description: "Email on the deploy commit, e.g. '<user-id>+<slug>[bot]@users.noreply.github.com'. Empty keeps the CI identity."
    required: false
    default: ""
runs:
  using: composite
  steps:
    - shell: bash
      # Inputs reach the script through the environment, never through the script text.
      env:
        IN_APP_NAME: ${{ inputs.app-name }}
        IN_IMAGE_BASE: ${{ inputs.image-base }}
        IN_TAG: ${{ inputs.tag }}
        IN_DIGEST: ${{ inputs.digest }}
        IN_MANIFEST: ${{ inputs.manifest }}
        IN_MANIFEST_DIR: ${{ inputs.manifest-dir }}
        IN_BRANCH: ${{ inputs.branch }}
        IN_GIT_USER_NAME: ${{ inputs.git-user-name }}
        IN_GIT_USER_EMAIL: ${{ inputs.git-user-email }}
      run: |
        set -eu
        ARGS=""
        [ -n "$IN_DIGEST" ] && ARGS="$ARGS --digest $IN_DIGEST"
        [ -n "$IN_MANIFEST" ] && ARGS="$ARGS --manifest $IN_MANIFEST"
        [ -n "$IN_MANIFEST_DIR" ] && ARGS="$ARGS --manifest-dir $IN_MANIFEST_DIR"
        # A bot name carries brackets and an identity may carry spaces, so these two travel as
        # positional words, not through the word-split ARGS.
        set --
        [ -n "$IN_GIT_USER_NAME" ] && set -- "$@" --git-user-name "$IN_GIT_USER_NAME"
        [ -n "$IN_GIT_USER_EMAIL" ] && set -- "$@" --git-user-email "$IN_GIT_USER_EMAIL"
        # shellcheck disable=SC2086
        "${{ github.action_path }}/bump-deploy-tag.sh" \
          --app-name "$IN_APP_NAME" \
          --image-base "$IN_IMAGE_BASE" \
          --tag "$IN_TAG" \
          --branch "$IN_BRANCH" \
          $ARGS "$@"
