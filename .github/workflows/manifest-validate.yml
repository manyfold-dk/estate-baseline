name: Manifest validate (reusable)

on:
  workflow_call:
    inputs:
      kustomize-dir:
        description: Directory containing kustomization.yaml to build + validate
        type: string
        required: true
      skip-kinds:
        description: Comma-separated resource kinds to skip (for CRDs absent from the schema catalog)
        type: string
        default: ""

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - name: Install kustomize + kubeconform (pinned + checksummed)
        run: |
          set -euo pipefail
          KUSTOMIZE_VERSION=5.8.1
          KUSTOMIZE_SHA256=029a7f0f4e1932c52a0476cf02a0fd855c0bb85694b82c338fc648dcb53a819d
          KUBECONFORM_VERSION=0.7.0
          KUBECONFORM_SHA256=c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3
          curl -sSLo kustomize.tgz "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"
          echo "${KUSTOMIZE_SHA256}  kustomize.tgz" | sha256sum -c -
          tar xzf kustomize.tgz kustomize && sudo mv kustomize /usr/local/bin/
          curl -sSLo kubeconform.tgz "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tgz" | sha256sum -c -
          tar xzf kubeconform.tgz kubeconform && sudo mv kubeconform /usr/local/bin/
      - name: Build + validate
        # Inputs reach the shell as environment variables, never as interpolated source: a
        # caller-controlled value is data here, not code.
        env:
          KUSTOMIZE_DIR: ${{ inputs.kustomize-dir }}
          SKIP_KINDS: ${{ inputs.skip-kinds }}
        run: |
          set -euo pipefail
          SKIP_ARGS=""
          [ -n "$SKIP_KINDS" ] && SKIP_ARGS="-skip $SKIP_KINDS"
          # shellcheck disable=SC2086
          kustomize build "$KUSTOMIZE_DIR" | \
            kubeconform -strict -summary \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
              $SKIP_ARGS
