name: Secret scan (reusable)

# Reusable gitleaks scan of the commits an event introduced. This is the control; a local
# pre-commit hook is only a convenience, because --no-verify and a fresh clone both skip it.
# Call it on pull_request and on push to the default branch. A scheduled caller can pass
# full-history: true for a sweep of every ref.
#
# A finding fails the job with file, line and rule; the value is redacted. A false positive
# goes in the caller's .gitleaksignore by fingerprint.

on:
  workflow_call:
    inputs:
      full-history:
        description: Scan every commit on every ref instead of the event's range.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0 # the range needs both ends of it
          persist-credentials: false
      - uses: manyfold-dk/estate-baseline/.github/actions/secret-scan@55dfb458d9e5ab3c3bc9212c0b19d304d1d50465 # unreleased
        with:
          full-history: ${{ inputs.full-history }}
