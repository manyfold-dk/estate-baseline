name: Secret scan

# gitleaks over the commits a pull request or a push to main introduced. A local pre-commit
# hook is skipped by --no-verify and by a fresh clone; this job is not. A finding fails with
# file, line and rule, value redacted; a false positive goes in .gitleaksignore by fingerprint.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    uses: manyfold-dk/estate-baseline/.github/workflows/secret-scan.yml@<sha>
